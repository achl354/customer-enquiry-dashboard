services:
  - type: web
    name: customer-enquiry-dashboard
    runtime: node
    # Free tier for now, to confirm the deploy pipeline works without adding
    # billing. Free instances have no persistent disk (SQLite resets on every
    # redeploy/restart) and spin down after ~15 min idle (which also stops
    # the per-minute poller until the next request wakes it up) — fine for
    # confirming the app deploys and loads, not for real data retention or
    # reliable live polling. Switch to `plan: starter` and re-add a `disk:`
    # block (mountPath e.g. /var/data, with DB_PATH pointed at it) once ready
    # to keep this running for real.
    plan: free
    # --include=dev is required here: NODE_ENV=production (set below) makes
    # npm install skip devDependencies by default, which would leave vite
    # (a frontend devDependency) missing and fail "npm run build" with
    # "vite: not found". The backend's own install doesn't need this since
    # it only ever runs `node src/server.js`, no dev-only build step.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: POLL_CRON_EXPRESSION
        value: "* * * * *"
      # Off by default. seed.js is now idempotent (skips reseeding if data
      # already exists, see scripts/seed.js), so leaving this on is much
      # safer than it used to be — but there's still no reason to pay for
      # even one classification pass on every redeploy when nothing's
      # changed in the demo data. Set to "true" only for a one-off repopulate
      # after a real data/seed change, then set back to "false".
      - key: SEED_ON_BOOT
        value: "false"
      # Secrets — left blank on purpose (sync: false means Render prompts you
      # to fill these in via its dashboard rather than storing them in git).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: MAILBOX
        sync: false
      # HTTP Basic Auth in front of the whole dashboard — this shows real
      # customer/health-department correspondence with no other access
      # control, so set both of these once real data is flowing through it.
      # Leaving either blank disables auth entirely (fine for a quick demo
      # check, not once it's more than that).
      - key: DASHBOARD_USERNAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
