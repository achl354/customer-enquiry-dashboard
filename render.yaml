services:
  - type: web
    name: customer-enquiry-dashboard
    runtime: node
    plan: starter
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    disk:
      name: enquiries-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/enquiries.db
      - key: POLL_CRON_EXPRESSION
        value: "* * * * *"
      # Secrets — left blank on purpose (sync: false means Render prompts you
      # to fill these in via its dashboard rather than storing them in git).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: MAILBOX
        sync: false
